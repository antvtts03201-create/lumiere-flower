<!DOCTYPE html>
<html lang="vi">

<head>
  <title>Giỏ hàng - Lumière Flower</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Font Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <!-- Header (được vẽ bởi main.js) -->
  <div id="hdr"></div>

  <div class="wrap">
    <h2>Giỏ hàng</h2>

    <div class="cols">

      <!-- Cột trái: danh sách sản phẩm trong giỏ (được vẽ bởi cart.js) -->
      <div id="cartBody"></div>

      <!-- Cột phải: tổng tiền, mã giảm giá, nút thanh toán -->
      <div>

        <div class="box" id="sum"></div>

        <div class="box">
          <input class="fld" id="coupon" placeholder="Mã giảm giá (LUMIERE10)">
          <button class="btn sm" onclick="applyCoupon()">Áp dụng</button>
        </div>

        <a class="btn" href="checkout.html" style="width:100%; text-align:center">
          Tiến hành thanh toán →
        </a>

        <br><br>

        <a href="products.html">← Tiếp tục mua sắm</a>

      </div>
    </div>
  </div>

  <!-- Footer (được vẽ bởi main.js) -->
  <div id="ftr"></div>

  <!-- Thứ tự nạp: data.js -> main.js -> cart.js (không đổi thứ tự) -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>

</body>

</html>
