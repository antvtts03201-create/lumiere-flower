<!DOCTYPE html>
<html lang="vi">

<head>
  <title>Lumière Flower</title>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <div id="hdr"></div>

  <section class="slider hero" id="slider"></section>

  <div class="wrap">

    <div class="cats" id="cats"></div>

    <h2>Sản phẩm nổi bật</h2>

    <div class="grid" id="featured"></div>

    <div class="about" id="about" style="margin-top:40px">

      <div class="pic">💐</div>

      <div>
        <h2 style="margin-top:0">Lumière Flower</h2>

        <p>
          Chúng tôi tin rằng mỗi bó hoa đều mang một câu chuyện,
          một cảm xúc và một thông điệp riêng.
        </p>

        <br>

        <a class="btn sm" href="products.html">
          Tìm hiểu thêm →
        </a>
      </div>

    </div>

    <h2>Sản phẩm mới</h2>

    <div class="grid" id="newest"></div>

  </div>

  <div id="ftr"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>

  <script>

    document.addEventListener("DOMContentLoaded", () => {

      const P = getProducts();

      const slugs = [
        "hoa-tinh-yeu",
        "hoa-sinh-nhat",
        "hoa-cuoi",
        "hoa-chuc-mung",
        "hoa-dip-dac-biet",
        "hoa-theo-mua"
      ];

      document.getElementById("cats").innerHTML = CATEGORIES.map((c, i) =>
        `
        <a class="cat" href="products.html?cat=${encodeURIComponent(c)}">

          <span class="cat-img">
            <img
              src="assets/images/${slugs[i]}.jpg"
              alt="${c}"
              loading="lazy"
            >
          </span>

          ${c}

        </a>
        `
      ).join("");


      document.getElementById("featured").innerHTML =
        P
          .filter(p => p.isFeatured)
          .slice(0, 4)
          .map(card)
          .join("");


      document.getElementById("newest").innerHTML =
        P
          .filter(p => p.isNew)
          .slice(0, 4)
          .map(card)
          .join("");


      const banners = [
        "assets/images/lumiere_banner_1.png",
        "assets/images/lumiere_banner_2.png",
        "assets/images/lumiere_banner_3.png"
      ];


      const slider = document.getElementById("slider");

      let current = 0;


      slider.innerHTML = `
        <div class="banner">
          <img id="bannerImage" src="${banners[0]}" alt="">
        </div>

        <button class="arrow l">‹</button>

        <button class="arrow r">›</button>

        <div class="dots">
          ${banners.map(() => "<i></i>").join("")}
        </div>
      `;


      const bannerImage = document.getElementById("bannerImage");

      const dots = slider.querySelectorAll(".dots i");


      function showBanner(number) {

        current = (number + banners.length) % banners.length;

        bannerImage.src = banners[current];

        dots.forEach((dot, index) => {
          dot.classList.toggle("on", index === current);
        });

      }


      slider.querySelector(".l").onclick = () => {
        showBanner(current - 1);
      };


      slider.querySelector(".r").onclick = () => {
        showBanner(current + 1);
      };


      dots.forEach((dot, index) => {
        dot.onclick = () => {
          showBanner(index);
        };
      });


      showBanner(0);


      setInterval(() => {
        showBanner(current + 1);
      }, 5000);

    });

  </script>

</body>

</html>
