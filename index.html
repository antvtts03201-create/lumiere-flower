<!DOCTYPE html>
<html lang="vi">

<head>
    <title>Lumière Flower</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <div id="hdr"></div>

    <!-- BANNER -->
    <section class="slider hero" id="slider"></section>


    <div class="wrap">

        <!-- DANH MỤC -->
        <div class="cats" id="cats"></div>


        <!-- SẢN PHẨM NỔI BẬT -->
        <h2>Sản phẩm nổi bật</h2>

        <div class="grid" id="featured"></div>


        <!-- GIỚI THIỆU -->
        <div class="about" id="about" style="margin-top:40px">

            <div class="pic">
                💐
            </div>

            <div>

                <h2 style="margin-top:0">
                    Lumière Flower
                </h2>

                <p>
                    Chúng tôi tin rằng mỗi bó hoa đều mang một câu chuyện,
                    một cảm xúc và một thông điệp riêng.
                </p>

                <br>

                <a class="btn sm" href="products.html">
                    Tìm hiểu thêm →
                </a>

            </div>

        </div>


        <!-- SẢN PHẨM MỚI -->
        <h2>Sản phẩm mới</h2>

        <div class="grid" id="newest"></div>

    </div>


    <div id="ftr"></div>


    <script src="js/data.js"></script>
    <script src="js/main.js"></script>


    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const P = getProducts();


            /* =========================
               DANH MỤC
            ========================= */

            const slugs = [
                "hoa-tinh-yeu",
                "hoa-sinh-nhat",
                "hoa-cuoi",
                "hoa-chuc-mung",
                "hoa-dip-dac-biet",
                "hoa-theo-mua"
            ];

            document.getElementById("cats").innerHTML =
                CATEGORIES.map((c, i) => `

                    <a class="cat"
                       href="products.html?cat=${encodeURIComponent(c)}">

                        <span class="cat-img">

                            <img
                                src="assets/images/${slugs[i]}.jpg"
                                alt="${c}"
                                loading="lazy"
                            >

                        </span>

                        ${c}

                    </a>

                `).join("");


            /* =========================
               SẢN PHẨM NỔI BẬT
            ========================= */

            document.getElementById("featured").innerHTML =
                P
                    .filter(p => p.isFeatured)
                    .slice(0, 4)
                    .map(card)
                    .join("");


            /* =========================
               SẢN PHẨM MỚI
            ========================= */

            document.getElementById("newest").innerHTML =
                P
                    .filter(p => p.isNew)
                    .slice(0, 4)
                    .map(card)
                    .join("");


            /* =========================
               BANNER
            ========================= */

            const banners = [
                "assets/images/lumiere_banner_1.png",
                "assets/images/lumiere_banner_2.png",
                "assets/images/lumiere_banner_3.png"
            ];


            const slider = document.getElementById("slider");

            let current = 0;


            /* Tạo 3 banner */

            slider.innerHTML = `

                ${banners.map((image, index) => `

                    <div class="slide">

                        <img
                            src="${image}"
                            alt="Lumière Flower Banner ${index + 1}"
                        >

                    </div>

                `).join("")}


                <button class="arrow l" type="button">
                    ‹
                </button>


                <button class="arrow r" type="button">
                    ›
                </button>


                <div class="dots">

                    ${banners.map(() => `
                        <i></i>
                    `).join("")}

                </div>

            `;


            const slides =
                slider.querySelectorAll(".slide");

            const dots =
                slider.querySelectorAll(".dots i");


            /* =========================
               CHUYỂN SLIDE
            ========================= */

            function showSlide(number) {

                current =
                    (number + banners.length)
                    % banners.length;


                slides.forEach((slide, index) => {

                    if (index === current) {
                        slide.classList.add("on");
                    } else {
                        slide.classList.remove("on");
                    }

                });


                dots.forEach((dot, index) => {

                    if (index === current) {
                        dot.classList.add("on");
                    } else {
                        dot.classList.remove("on");
                    }

                });

            }


            /* NÚT TRÁI */

            slider
                .querySelector(".l")
                .onclick = () => {

                    showSlide(current - 1);

                };


            /* NÚT PHẢI */

            slider
                .querySelector(".r")
                .onclick = () => {

                    showSlide(current + 1);

                };


            /* CHẤM */

            dots.forEach((dot, index) => {

                dot.onclick = () => {

                    showSlide(index);

                };

            });


            /* HIỂN THỊ BANNER ĐẦU */

            showSlide(0);


            /* TỰ ĐỘNG CHUYỂN */

            setInterval(() => {

                showSlide(current + 1);

            }, 5000);

        });

    </script>

</body>

</html>
