<!DOCTYPE html>
<html lang="vi">

<head>
    <title>Đăng ký - Lumière Flower</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <div id="hdr"></div>
    <div class="authbox">
        <h1>Đăng ký</h1>
        <form id="regForm"><input class="fld" name="name" placeholder="Họ tên" required><input class="fld" name="email"
                type="email" placeholder="Email" required><input class="fld" name="password" type="password"
                minlength="6" placeholder="Mật khẩu" required><input class="fld" name="confirm" type="password"
                placeholder="Xác nhận mật khẩu" required><button class="btn" style="width:100%">Đăng ký</button></form>
        <p style="margin-top:12px">Đã có tài khoản? <a href="login.html" style="color:var(--rose)">Đăng nhập</a></p>
    </div>
    <div id="ftr"></div>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
